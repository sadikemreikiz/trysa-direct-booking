version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR a week for routine updates; major versions still get their own PR.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types must match the Node.js runtime (24, see .nvmrc), not the newest Node release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Blocked upstream: eslint-config-next and typescript-eslint don't support these majors yet.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
