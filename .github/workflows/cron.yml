# Triggers maintenance jobs (notification retries, unanswered-request reminders, data retention)
# every 15 minutes. Lives here because the Vercel Hobby plan limits cron jobs to once a day.
# Required repository secrets: SITE_URL (e.g. https://trysacamping.com) and CRON_SECRET (same as on Vercel).
name: cron

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Least privilege: the jobs only read the code.
permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call /api/cron
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron"
