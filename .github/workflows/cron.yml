# Backup trigger for the maintenance jobs (notification retries, unanswered-request reminders,
# data retention). cron-job.org calls /api/cron every 15 minutes from 08:00 to 23:00 Turkish
# time; this schedule asks for every 15 minutes, but GitHub runs scheduled workflows only every
# 2–7 hours in practice (measured in October 2026), so it only covers for cron-job.org.
# Vercel Hobby allows one cron a day.
# Required repository secrets: SITE_URL (e.g. https://trysacamping.com) and CRON_SECRET (same as on Vercel).
name: cron

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Least privilege: the jobs only read the code.
permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call /api/cron
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron"
